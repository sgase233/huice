# Purpose: expose the Huice API on port 80 of the ECS instance (M1).
# Install: /etc/nginx/conf.d/huice-api.conf  (see infra/deploy/README.md)
# Notes: the API itself listens on 127.0.0.1:8000 only. Keep this file free of
#        secrets; TLS and the real domain come after ICP filing (infra/README.md §5.2 D).

# 每 IP 的粗粒度突发兜底（conf.d 被 include 在 http 块里，这里的 zone 只能写在顶层）。
# 它只挡瞬时洪峰：真正的「连续失败就锁」在后端 LoginLimiter 里按失败次数做，nginx 看不到
# 密码对不对，替代不了那一层；同样，后端的锁也不会替 nginx 挡住每秒上万个无效连接。
limit_req_zone $binary_remote_addr zone=huice_api_ip:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # API-04 accepts up to 5 files × 10 MiB; leave room for multipart overhead.
    client_max_body_size 60m;
    client_body_timeout 60s;

    # 不把上游版本号、连接信息暴露给客户端。
    server_tokens off;

    access_log /var/log/nginx/huice-api.access.log;
    error_log  /var/log/nginx/huice-api.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 上传与 PDF 解析是同步阻塞工作，(5 × 10 MiB) 留足时间。
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 流式转发，避免先把大请求体读进内存。
        proxy_request_buffering off;

        # 超限直接 429（默认是 503，会被当成「服务不可用」）。响应体是 nginx 自己的
        # 页面、不是 ApiError 信封——前端只应把这一档当成「稍后再试」，不要按字段解析。
        limit_req zone=huice_api_ip burst=40 nodelay;
        limit_req_status 429;
    }
}
