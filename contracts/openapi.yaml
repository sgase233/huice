            ETag: *id012
          content:
            application/json:
              schema: *id020
              example: *id021
        default:
          $ref: '#/components/responses/ApiFailure'
        '400': *id004
        '401': *id005
        '403': *id006
        '404': *id013
        '500': *id007
        '503': *id008
  /enterprises/{enterpriseId}/facts/{factKey}:
    patch:
      operationId: updateFact
      summary: API-10
      description: Upsert exact key+period. null means unknown. Same canonical content leaves factVersion unchanged.
      tags:
      - public
      security:
      - DemoSession: []
      parameters:
      - $ref: '#/components/parameters/enterpriseId'
