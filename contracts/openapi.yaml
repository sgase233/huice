            $ref: '#/components/schemas/UUID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 运行列表
          headers:
            X-Trace-Id: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSummaryList'
              examples:
                mixed:
                  value:
                    items:
                    - id: 55555555-5555-4555-8555-555555555555
                      enterpriseId: 11111111-1111-4111-8111-111111111111
                      asOf: '2026-10-23T10:00:00+08:00'
                      createdAt: '2026-10-23T02:00:00Z'
                      status: succeeded
                      reportAvailable: true
                    - id: 99999999-9999-4999-8999-999999999999
                      enterpriseId: 11111111-1111-4111-8111-111111111111
                      asOf: '2026-11-10T09:00:00+08:00'
                      createdAt: '2026-11-10T01:00:00Z'
                      status: failed
                      reportAvailable: false
                    nextCursor: null
                reviewerFilteredByAnotherEnterprise:
                  summary: 审核员用 ?enterpriseId=其他人的企业 —— 允许，只返回该企业的 run
                  value:
                    items:
                    - id: 55555555-5555-4555-8555-555555555555
                      enterpriseId: 11111111-1111-4111-8111-111111111111
                      asOf: '2026-10-23T10:00:00+08:00'
