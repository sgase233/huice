components:
  securitySchemes:
    DemoSession:
      type: apiKey
      in: cookie
      name: huice_demo_session
      description: restricted gateway only; HttpOnly Secure SameSite=Lax cookie. Local loopback mode bypasses this
        scheme only.
    AdminBearer:
      type: http
      scheme: bearer
      description: Runtime-only ADMIN_TOKEN; E1 起**只读**（后台读接口与轨迹），任何写操作都用 UserSession；never VITE/localStorage.
    UserSession:
      type: apiKey
      in: cookie
      name: huice_session
      description: 登录会话（HttpOnly、可撤销、只存令牌摘要）。E1 起是唯一可写的身份；运维 Bearer 只读。
  parameters:
    policyId:
      name: policyId
      in: path
      required: true
      schema: *id028
    enterpriseId:
      name: enterpriseId
      in: path
      required: true
      schema: *id028
    runId:
      name: runId
      in: path
      required: true
      schema: *id028
    factKey:
      name: factKey
      in: path
      required: true
      schema: &id030
        $ref: '#/components/schemas/FactKey'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[^"\r\n]+"$
      description: Strong quoted token from latest read. Missing=428; mismatch=409; no * or W/.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *id028
      description: Extraction only. Same body/key replays committed result without charging twice, unless draft
        has since changed.
    Version:
      name: version
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    PolicyType:
      name: type
      in: query
      required: false
      schema: &id053
        $ref: '#/components/schemas/PolicyType'
    PublicStatus:
      name: status
      in: query
      required: false
      schema: &id056
        $ref: '#/components/schemas/PolicyStatus'
    AdminStatus:
      name: status
      in: query
      required: false
      schema: &id073
        $ref: '#/components/schemas/DraftStatus'
    Region:
      name: region
      in: query
      required: false
      description: '行政区划码（如 440300）。按该区划筛同时包含全国性政策：全国性政策
        的 region 记 `CN`，不随区划码变化。只查全国性政策请直接传 `CN`。'
      schema:
        type: string
        minLength: 1
    AsOf:
      name: asOf
      in: query
      required: false
      schema: &id035
        $ref: '#/components/schemas/Timestamp'
  responses:
    ApiFailure: *id007
  schemas:
    UUID:
      type: string
      format: uuid
    Date:
      type: string
      format: date
    Timestamp:
      type: string
      format: date-time
    DecimalString:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]{1,6})?$
      description: Base-10 string; field-specific scale and nonnegative checks also apply.
    OfficialUrl:
      type: string
      format: uri
      pattern: ^https://
      description: Server must validate the final official host and reject private/internal destinations.
    Period:
      type: object
      additionalProperties: false
      required:
      - startDate
      - endDate
      properties:
        startDate: &id029
          $ref: '#/components/schemas/Date'
        endDate: *id029
      description: Inclusive dates. Server rejects startDate > endDate.
    FactKey:
      type: string
      enum:
      - region
      - industry
      - establishedDate
      - taxableIncome
      - rdExpense
      - rdActivity
      - employeeCountStart
      - employeeCountEnd
      - assetsStart
      - assetsEnd
      - revenue
      - equityFinancing
      - rdExpenseIncrease
      - rdExpenseRevenueRatio
      - rdAddDeductionClaimed
      - creditRecord
      - specificMarketSince
      - independentLegalEntity
    FactUnit:
      type: string
      enum:
      - code
      - date
      - CNY
      - boolean
      - person
      - ratio
    AssessmentResult:
      type: string
      enum:
      - satisfied
      - not_satisfied
      - insufficient_evidence
      - conflict
    Validity:
      type: string
      enum:
      - current
      - stale
    PolicyStatus:
      type: string
      enum:
      - published
      - closed
    DraftStatus:
      type: string
      enum:
      - pending_parse
      - pending_review
      - published
      - closed
    PolicyType:
      type: string
      enum:
      - tax
      - grant
    AgentStatus:
      type: string
      enum:
      - ok
      - needs_review
      - retryable_error
      - fatal_error
    FactSource:
      type: string
      enum:
      - user_input
      - synthetic_material
    Comparator:
      type: string
      enum:
      - lt
      - lte
      - eq
      - gte
      - gt
      - ne
    FactRef:
      type: object
      additionalProperties: false
      required:
      - key
      - period
      properties:
        key: *id030
        period: &id031
          $ref: '#/components/schemas/Period'
    FactInput:
      type: object
      additionalProperties: false
      required:
      - key
      - value
      - unit
      - period
      - source
      properties:
        key: *id030
        value: &id032
          oneOf:
          - type: string
          - type: boolean
          - type: 'null'
        unit: &id033
          $ref: '#/components/schemas/FactUnit'
        period: *id031
        source: &id034
          $ref: '#/components/schemas/FactSource'
      if:
        properties:
          key:
            enum:
            - region
            - industry
      then:
        properties:
          value:
            anyOf:
            - type: string
              minLength: 1
            - type: 'null'
          unit:
            const: code
      else:
        if:
          properties:
            key:
              enum:
              - establishedDate
        then:
          properties:
            value:
              anyOf:
              - *id029
              - type: 'null'
            unit:
              const: date
        else:
          if:
            properties:
              key:
                enum:
                - taxableIncome
          then:
            properties:
              value:
                anyOf:
                - type: string
                  pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]{1,2})?$
                - type: 'null'
              unit:
                const: CNY
          else:
            if:
              properties:
                key:
                  enum:
                  - rdExpense
                  - assetsStart
                  - assetsEnd
            then:
              properties:
                value:
                  anyOf:
                  - type: string
                    pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$
                  - type: 'null'
                unit:
                  const: CNY
            else:
              if:
                properties:
                  key:
                    enum:
                    - employeeCountStart
                    - employeeCountEnd
              then:
                properties:
                  value:
                    anyOf:
                    - type: string
                      pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$
                    - type: 'null'
                  unit:
                    const: person
              else:
                if:
                  properties:
                    key:
                      enum:
                      - rdActivity
                then:
                  properties:
                    value:
                      anyOf:
                      - type: boolean
                      - type: 'null'
                    unit:
                      const: boolean
                else: {}
    EnterpriseFact:
      type: object
      additionalProperties: false
      required:
      - key
      - value
      - unit
      - period
      - source
      - verified
      properties:
        key: *id030
        value: *id032
        unit: *id033
        period: *id031
        source: *id034
        verified:
          type: boolean
      if:
        properties:
          key:
            enum:
            - region
            - industry
      then:
        properties:
          value:
            anyOf:
            - type: string
              minLength: 1
            - type: 'null'
          unit:
            const: code
      else:
        if:
          properties:
            key:
              enum:
              - establishedDate
        then:
          properties:
            value:
              anyOf:
              - *id029
              - type: 'null'
            unit:
              const: date
        else:
          if:
            properties:
              key:
                enum:
                - taxableIncome
          then:
            properties:
              value:
                anyOf:
                - type: string
                  pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]{1,2})?$
                - type: 'null'
              unit:
                const: CNY
          else:
            if:
              properties:
                key:
                  enum:
                  - rdExpense
                  - assetsStart
                  - assetsEnd
            then:
              properties:
                value:
                  anyOf:
                  - type: string
                    pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$
                  - type: 'null'
                unit:
                  const: CNY
            else:
              if:
                properties:
                  key:
                    enum:
                    - employeeCountStart
                    - employeeCountEnd
              then:
                properties:
                  value:
                    anyOf:
                    - type: string
                      pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$
                    - type: 'null'
                  unit:
                    const: person
              else:
                if:
                  properties:
                    key:
                      enum:
                      - rdActivity
                then:
                  properties:
                    value:
                      anyOf:
                      - type: boolean
                      - type: 'null'
                    unit:
                      const: boolean
                else: {}
    FactUpdate:
      type: object
      additionalProperties: false
      required:
      - value
      - unit
      - period
      - source
      properties:
        value: *id032
        unit: *id033
        period: *id031
        source: *id034
      description: Target factKey is in the URL; period identifies the exact fact. Server validates key/value/unit
        together.
      examples:
      - value: '2800000.00'
        unit: CNY
        period: *id019
        source: user_input
    EnterpriseInput:
      type: object
      additionalProperties: false
      required:
      - nameSynthetic
      - period
      - facts
      properties:
        nameSynthetic:
          type: string
          minLength: 1
          maxLength: 100
        period: *id031
        facts:
          type: array
          items:
            $ref: '#/components/schemas/FactInput'
          minItems: 2
      description: Require exactly one non-null region and industry for the profile period. Unique key+period; no
        user-supplied verified flag.
      examples:
      - nameSynthetic: 合成企业A
        period: *id019
        facts:
        - key: region
          value: '440300'
          unit: code
          period: *id019
          source: user_input
        - key: industry
          value: C39
          unit: code
          period: *id019
          source: user_input
        - key: taxableIncome
          value: null
          unit: CNY
          period: *id019
          source: user_input
    Enterprise:
      type: object
      additionalProperties: false
      required:
      - id
      - nameSynthetic
      - period
      - facts
      - factVersion
      properties:
        id: *id028
        nameSynthetic:
          type: string
        period: *id031
        facts:
          type: array
          items:
            $ref: '#/components/schemas/EnterpriseFact'
        factVersion:
          type: string
          pattern: ^[a-f0-9]{64}$
      examples:
      - *id021
    ApplicationWindow:
      type: object
      additionalProperties: false
      required:
      - opensAt
      - closesAt
      properties:
        opensAt: *id035
        closesAt: *id035
      description: Half-open [opensAt,closesAt); server requires opensAt < closesAt.
    SourceSpan:
      type: object
      additionalProperties: false
      required:
      - sourceId
      - sourceUrl
      - sourceVersion
      - page
      - section
      - quote
      - textHash
      properties:
        sourceId: *id028
        sourceUrl: &id036
