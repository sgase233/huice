x-error-codes:
  - code: UNAUTHENTICATED
    status: 401
    meaning: 未提供任何凭证。
  - code: SESSION_INVALID
    status: 401
    meaning: 会话已过期或已撤销。details.reason ∈ expired / revoked / unknown。
  - code: TOKEN_INVALID
    status: 401
    meaning: Bearer 无效。
  - code: DEMO_SESSION_REQUIRED
    status: 403
    meaning: >-
      restricted 模式的外层 demo 门禁未通过（缺失、格式/签名不对、已过期，不区分）；
      沿用现有错误码，判定在所有身份判定之前，带有效 Bearer 或有效会话也不能绕过。
      豁免：GET /health、POST /auth/logout。
  - code: DEMO_SESSION_INVALID
    status: 401
    meaning: >-
      **只在 local 模式可达**：没有门禁挡在前面，携带的 demo cookie 签名无效或已过期，
      且没有更高优先级的有效凭证；按「提供但无效即 401」处理。
      restricted 下不存在这个分支（门禁层已经用 403 拦下）。
  - code: INVALID_CREDENTIALS
    status: 401
    meaning: 用户名或密码错误；两者不区分。
  - code: CSRF_REQUIRED
    status: 403
    meaning: 带会话的写请求缺少 X-CSRF-Token 或不匹配。
  - code: ORIGIN_MISMATCH
    status: 403
    meaning: Origin 缺失或与 PUBLIC_ORIGIN 不同源（注册/登录同样适用）。
  - code: ROLE_FORBIDDEN
    status: 403
    meaning: 凭证有效但角色不允许，或 Bearer 调用了写操作/业务列表。
  - code: DEMO_SESSION_LEGACY
    status: 403
    meaning: 旧版 demo cookie（无 sid），只读。
  - code: OBJECT_NOT_FOUND
    status: 404
    meaning: 对象不存在或不属于当前身份；与「不存在」不区分。
  - code: RUN_NOT_COMPLETED
    status: 409
    meaning: >-
      该 run 尚未成功完成（queued/running/failed，以及未来出现的未知取值，含 E3b 的
      interrupted），详情与报告接口不给结果。是否给 interrupted 单列错误码待共同评审。
  - code: USERNAME_TAKEN
    status: 409
    meaning: 用户名已被占用（唯一约束）。
  - code: ENTERPRISE_ALREADY_BOUND
    status: 409
    meaning: 该账号已绑定企业，不能再创建第二家。
  - code: DEMO_QUOTA_EXCEEDED
    status: 429
    meaning: 单次演示会话超过 20 个无主样本。
  - code: ACCOUNT_LOCKED
    status: 429
    meaning: 同一 IP 连续失败过多，锁定 15 分钟。
  - code: VALIDATION_ERROR
    status: 422
    meaning: 沿用现有业务校验错误码族，不改结构。
  - code: DEPENDENCY_UNAVAILABLE
    status: 503
    meaning: 数据库/缓存/对象存储不可用；响应不含连接串。
x-e1-impact-conventions:
  gate: restricted 模式的外层门禁（DemoSession）；local 模式一律 none。
  identity: 门禁通过后按 security 选身份（列表内 OR）；「提供但无效」不降级。
  roles: 身份层之后；角色不满足 → 403 ROLE_FORBIDDEN。
  ownership: 角色层之后；对象不属于当前身份 → 404 OBJECT_NOT_FOUND（与「不存在」同码）。
  csrf: 仅写请求；带会话必须 X-CSRF-Token + Origin，带 demo 要 Origin（+Referer）不要求 CSRF，Bearer/无凭证不校验。
  bearer-scope: Bearer 的只读面 = /admin/** 查询、全部 run 轨迹、/health；其余业务读一律 403。
