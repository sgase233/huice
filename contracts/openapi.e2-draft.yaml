      summary: DISC-06
      description: >-
        人工确认元数据（必填）与结构化条件（可选）。metadata 是替换语义：与 PolicyImportMetadata
        字段同名，但**全部可空**——原文没给的字段留 null 并进 missingFields，不猜。
        另有两项只在候选阶段有意义：version（政策版本号，提交时必填）与 policyId
        （提交到既有政策；null=新建一条）。

        传了 criteriaDrafts 就整组替换结构化条件，并按与 API-06 相同的引用 / 表达式 / 合取为空
        校验重算 validationStatus；校验不通过的条款照样保存（人工还能再改），但提交会被 422 拦下。
        extraction_failed 的候选在补齐条件后自动转为 pending_review。
        取证字段（sourceUrl / fetchedAt / contentHash / rawHash / bodyText）不可改，传了也会被忽略。
      tags:
      - admin
      security:
      - UserSession: []
      x-e1-gate:
        local: none
        restricted: DemoSession
