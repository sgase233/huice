# HTTP contract draft, not an implemented server. M1 owns; M2 reviews.
openapi: 3.1.0
info:
  title: 惠策协同 HTTP 协作契约
  version: 1.0.0-rc.5
  description: 2026-10-31 候选冻结版（rc.5：新增 manual_review 算子，表达「本条须人工核查、不得自动下结论」；同时修正 rc.4 的 DateExpression.factKey 实际仍写死 establishedDate 的问题，改为 enum 两个日期键）。rc.4 为 2026-10-29 版（事实字典再扩 2 键 specificMarketSince / independentLegalEntity，见 FactKey；date 算子不再只认 establishedDate）。rc.3 为 2026-10-28 版（事实字典扩 6 键，新增 ratio 单位的条件取值校验）。rc.2 为 2026-10-23 版（模型模式 maas 改为 deepseek）。M1 已实现 API-01/04/15/16（健康检查、政策导入、后台草稿列表与详情），其余接口按里程碑实现；M2 复核后定版 1.0.0。restricted 模式需要网关会话；local 模式免 DemoSession，但管理 Bearer 仍必需。导入后草稿为 pending_parse，条款抽取（API-05）完成后才进入 pending_review。语义/流程见工作区《惠策协同_功能实现逻辑与接口协作约定.md》。
servers:
- url: /api/v1
tags:
- name: public
- name: admin
paths:
  /health:
    get:
      operationId: getHealth
      summary: API-01
      description: ''
      tags:
      - public
      security: []
      parameters: []
      responses:
        '200':
          description: 成功
          headers:
            X-Trace-Id: &id001
              description: Request trace UUID; error body uses the same value.
              schema: &id028
                $ref: '#/components/schemas/UUID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: 1.0.0-rc.3
        default:
          $ref: '#/components/responses/ApiFailure'
        '400': &id004
          description: 请求语法或查询参数错误
          content:
            application/json:
              schema: &id002
                $ref: '#/components/schemas/ApiError'
          headers: &id003
            X-Trace-Id: *id001
        '401': &id005
          description: 未认证
          content:
            application/json:
              schema: *id002
          headers: *id003
        '403': &id006
          description: 权限不足
          content:
            application/json:
              schema: *id002
          headers: *id003
        '500': &id007
          description: 内部错误（脱敏）
          content:
            application/json:
              schema: *id002
          headers: *id003
        '503': &id008
          description: 依赖不可用
          content:
            application/json:
              schema: *id002
          headers: *id003
  /policies:
    get:
      operationId: listPolicies
      summary: API-02
      description: Published/closed only. Omitted status includes both. asOf is an optional metadata filter, not
        a historical-version selector.
      tags:
      - public
      security:
      - DemoSession: []
      parameters:
      - $ref: '#/components/parameters/PublicStatus'
      - $ref: '#/components/parameters/PolicyType'
      - $ref: '#/components/parameters/Region'
      - $ref: '#/components/parameters/AsOf'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功
          headers:
            X-Trace-Id: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyList'
              example:
                items:
                - &id058
                  id: 22222222-2222-4222-8222-222222222222
                  title: 合成演示政策（非真实政策）
                  type: tax
                  issuer: 演示发布者
                  region: '440300'
                  version: demo-v1
                  status: published
                  effectiveFrom: '2026-01-01'
                  effectiveTo: null
                  applicationWindow: null
                  sourceUrl: https://www.gov.cn/
                nextCursor: null
        default:
          $ref: '#/components/responses/ApiFailure'
        '400': *id004
        '401': *id005
        '403': *id006
        '500': *id007
        '503': *id008
  /policies/{policyId}:
    get:
      operationId: getPolicy
      summary: API-03
      description: Default latest published version. Unpublished or unknown explicit version returns 404.
      tags:
      - public
      security:
      - DemoSession: []
      parameters:
      - $ref: '#/components/parameters/policyId'
      - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: 成功
          headers:
            X-Trace-Id: *id001
          content:
            application/json:
              schema: &id018
                $ref: '#/components/schemas/PolicyDetail'
              example: &id065
                id: 22222222-2222-4222-8222-222222222222
                title: 合成演示政策（非真实政策）
                type: tax
                issuer: 演示发布者
                region: '440300'
                version: demo-v1
                status: published
                effectiveFrom: '2026-01-01'
                effectiveTo: null
                applicationWindow: null
                sourceUrl: https://www.gov.cn/
                documentNumber: null
                applicableEntities: &id009
                - 合成企业
                publishedAt: '2026-01-01'
                officialEntryUrl: https://www.gov.cn/
                sources: &id010
                - id: 44444444-4444-4444-8444-444444444444
                  kind: body
                  sourceUrl: https://www.gov.cn/
                  title: 合成演示原文
                  fetchedAt: '2026-10-23T02:00:00Z'
                  contentHash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  text: 此处仅为接口结构演示，不是真实政策。
                criteria: &id011
                - id: 33333333-3333-4333-8333-333333333333
                  title: 合成演示阈值
                  expression: &id046
                    op: compare
                    factKey: taxableIncome
                    period: assessment
                    comparator: lte
                    value: '3000000.00'
                    unit: CNY
                  sourceSpans: &id047
                  - sourceId: 44444444-4444-4444-8444-444444444444
                    sourceUrl: https://www.gov.cn/
                    sourceVersion: demo-v1
                    page: null
                    section: 合成演示条款
                    quote: 此处仅为接口结构演示，不是真实政策。
                    textHash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  reviewFinding: none
                  validationStatus: passed
                preparationTemplate: &id023
                  type: tax
                  handlingMode: tax_self_assessment
                  officialEntryUrl: https://www.gov.cn/
                  deadline: null
                  items: []
        default:
          $ref: '#/components/responses/ApiFailure'
        '400': *id004
        '401': *id005
        '403': *id006
        '404': &id013
          description: 记录不存在
          content:
            application/json:
              schema: *id002
          headers: *id003
        '500': *id007
        '503': *id008
  /admin/policies/import:
    post:
      operationId: importPolicy
      summary: API-04
      description: Creates a draft; never publishes. Up to 5 files, each <=10 MiB. Validate content and official
        final URL. The draft is returned with status pending_parse and empty criteria; 条款抽取（API-05）
        完成前不会出现 pending_review。
      tags:
      - admin
      security:
      - DemoSession: []
        AdminBearer: []
      parameters: []
      responses:
        '201':
          description: 成功
          headers:
            X-Trace-Id: *id001
            ETag: &id012
              description: Strong quoted version token; preserve verbatim in If-Match.
              schema:
                type: string
              example: '"44444444-4444-4444-8444-444444444444"'
          content:
            application/json:
              schema: &id026
                $ref: '#/components/schemas/PolicyDraft'
              example: &id027
                id: 22222222-2222-4222-8222-222222222222
                version: demo-v1
                title: 合成演示政策（非真实政策）
                type: tax
                issuer: 演示发布者
                region: '440300'
                documentNumber: null
                applicableEntities: *id009
                publishedAt: '2026-01-01'
                effectiveFrom: '2026-01-01'
                effectiveTo: null
                applicationWindow: null
                sourceUrl: https://www.gov.cn/
                officialEntryUrl: https://www.gov.cn/
                status: pending_parse
                revision: 44444444-4444-4444-8444-444444444444
                sources: *id010
                criteria: []
                validationFindings: []
        default:
          $ref: '#/components/responses/ApiFailure'
        '400': *id004
        '401': *id005
        '403': *id006
        '409': &id014
          description: 版本或幂等冲突
          content:
            application/json:
              schema: *id002
          headers: *id003
        '413':
          description: 文件超限
          content:
            application/json:
              schema: *id002
          headers: *id003
        '415':
          description: 不支持文件类型
          content:
            application/json:
              schema: *id002
          headers: *id003
        '422': &id015
          description: 业务或请求体校验失败
          content:
            application/json:
              schema: *id002
          headers: *id003
        '429': &id016
          description: 调用限流
          content:
            application/json:
              schema: *id002
          headers: *id003
        '500': *id007
        '503': *id008
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - metadata
              properties:
                metadata:
                  type: string
                  description: JSON.stringify(PolicyImportMetadata). Required; parsed and validated server-side.
                files:
                  type: array
                  description: 可选。第一个文件是政策正文（kind=body），其余为附件（kind=attachment）；
                    不传文件时草稿 sources 为空数组，正文抓取留待后续 ingestion 阶段。
                  items:
                    type: string
                    format: binary
                  maxItems: 5
  /admin/policies/{policyId}/extract:
    post:
      operationId: extractPolicy
      summary: API-05
      description: Target version in JSON. Idempotent extraction; do not overwrite concurrent manual edits.
      tags:
      - admin
      security:
      - DemoSession: []
        AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/policyId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 成功
          headers:
            X-Trace-Id: *id001
            ETag: *id012
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionResult'
        default:
          $ref: '#/components/responses/ApiFailure'
        '400': *id004
        '401': *id005
        '403': *id006
        '404': *id013
        '409': *id014
        '422': *id015
        '428': &id017
          description: 缺少 If-Match
          content:
            application/json:
              schema: *id002
          headers: *id003
        '429': *id016
        '500': *id007
        '503': *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractPolicyInput'
  /admin/policies/{policyId}/criteria:
    put:
      operationId: saveCriteria
      summary: API-06
      description: Save structurally valid drafts with failed findings. Server recomputes validation; bad JSON shape=422.
      tags:
      - admin
      security:
      - DemoSession: []
        AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/policyId'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: 成功
          headers:
            X-Trace-Id: *id001
            ETag: *id012
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveCriteriaResult'
        default:
          $ref: '#/components/responses/ApiFailure'
        '400': *id004
        '401': *id005
        '403': *id006
        '404': *id013
        '409': *id014
        '422': *id015
        '428': *id017
        '429': *id016
        '500': *id007
        '503': *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCriteriaInput'
  /admin/policies/{policyId}/publish:
    post:
      operationId: publishPolicy
      summary: API-07
      description: Revalidate citations and human review in same version transaction. Invalid source support=422.
      tags:
      - admin
      security:
      - DemoSession: []
        AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/policyId'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: 成功
          headers:
            X-Trace-Id: *id001
            ETag: *id012
          content:
            application/json:
              schema: *id018
        default:
          $ref: '#/components/responses/ApiFailure'
        '400': *id004
        '401': *id005
        '403': *id006
        '404': *id013
        '409': *id014
        '422': *id015
        '428': *id017
        '429': *id016
        '500': *id007
        '503': *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishPolicyInput'
  /enterprises:
    post:
      operationId: createEnterprise
      summary: API-08
      description: ''
      tags:
      - public
      security:
      - DemoSession: []
      parameters: []
      responses:
        '201':
          description: 成功
          headers:
            X-Trace-Id: *id001
            ETag: *id012
          content:
            application/json:
              schema: &id020
                $ref: '#/components/schemas/Enterprise'
              example: &id021
                id: 11111111-1111-4111-8111-111111111111
                nameSynthetic: 合成企业A
                period: &id019
                  startDate: '2026-01-01'
                  endDate: '2026-12-31'
                facts:
                - key: region
                  value: '440300'
