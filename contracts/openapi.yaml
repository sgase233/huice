# Current 16-endpoint contract. M1 owns; M2 reviews. Planned extensions: docs/EXTENSION_INTERFACES.md.
openapi: 3.1.0
info:
  title: 惠策协同 HTTP 协作契约
  version: 1.0.0-rc.10
  description: "2026-11-11 候选冻结版（rc.10：security 与 E1 的实际授权对齐——后台写操作只接受 UserSession，运维 Bearer 从「可写」改为「只读」；业务接口是 UserSession 或 DemoSession，不再声称 Bearer 能读；轨迹三个身份都可读。新增 securitySchemes.UserSession（cookie huice_session）。应答 M2 对 PR #61 的 P1「发布的 OpenAPI 与真实授权不符」；rc.9 为 2026-11-06 版（rc.9：PreparationItem.status 的取值改为事实口径 facts_filled / facts_missing / manual_check / policy_closed。原来的 provided 会被读成「材料已提交」，而服务端只读企业事实、不读材料，`provided` 实际只说「这份材料要证明的事实都有取值」——名字比它能证明的多说了一层；`missing` 同理，它说的是事实缺项，不是「材料没交」。missing 布尔字段的语义不变（保守口径，manual_check 也算 true）。应答 M2 对 PR #40 的 P1）。rc.8 为 2026-11-06 版（PreparationItem 新增必填 materialId 与 status，把「资料缺失」拆成 provided / missing / manual_check / policy_closed 四种明确状态——没有事实键的材料（申请书等）本就判断不了，不能显示成「资料缺失」；政策已关闭时材料不再提交，也不能记成缺失。missing 保留且仍是保守口径（manual_check 也算 true），展示以 status 为准。应答 M2 对 PR #37 的 P1；其中 provided / missing 两个名字在 rc.9 改为 facts_filled / facts_missing）。rc.7 为 2026-11-05 版（ModelUsage 新增可选字段 tokensUnknown，缺省 = inputTokens/outputTokens 为真实用量，true = 上游没有返回可用用量、两个数值是占位 0、不得当作真实用量；服务端已知时省略该字段，使常路径响应与 rc.6 逐字段一致——ModelUsage 是 additionalProperties:false，恒定输出 false 会让按 rc.6 严格校验的旧消费者拒绝正常响应。应答 M2 对 PR #34 的两条 P1：「API-05 把未知用量当确定的 0 返回」与「rc.7 兼容与迁移尚未闭环」）。rc.6 为 2026-11-03 版（轨迹步骤的 evidenceRefs 改为 objectRefs，元素为 TraceObjectRef={type,id}，与 CriterionResult.evidenceRefs 的引文分开；应答 M2 issue #27）。rc.5 为 2026-10-31 版（新增 manual_review 算子，表达「本条须人工核查、不得自动下结论」；同时修正 rc.4 的 DateExpression.factKey 实际仍写死 establishedDate 的问题，改为 enum 两个日期键）。rc.4 为 2026-10-29 版（事实字典再扩 2 键 specificMarketSince / independentLegalEntity，见 FactKey；date 算子不再只认 establishedDate）。rc.3 为 2026-10-28 版（事实字典扩 6 键，新增 ratio 单位的条件取值校验）。rc.2 为 2026-10-23 版（模型模式 maas 改为 deepseek）。现行 API-01—API-16 均已有实现；最终联合验收仍须留证，M1/M2 复核后定版。2026-11-09 的 issue #46—#48 扩展设计见 docs/EXTENSION_INTERFACES.md；其中 7 个新端点已实现，目前仍只写在 contracts/openapi.e1-draft.yaml，并入本契约要等前端类型重新生成。restricted 模式需要网关会话；local 模式免 DemoSession，但业务接口仍需身份（UserSession 或 DemoSession），后台写操作只接受审核员 UserSession。导入后草稿为 pending_parse，条款抽取（API-05）完成后才进入 pending_review。每个操作另有 x-e1-gate：local 无门禁，restricted 部署要**先**过演示会话门禁（huice_demo_session），只有 GET /health 与 POST /auth/logout 豁免；标准 security 只表达身份，restricted 下的实际要求是「门禁 + 该操作的 security」，连 security 为空的注册/登录也不例外。语义/流程见 docs/IMPLEMENTATION_AND_INTERFACE.md。"
servers:
- url: /api/v1
tags:
- name: public
- name: admin
x-e1-gate-model:
  standard-security-limitation: 标准 OpenAPI 3.1 的 security 只表达「这次请求需要哪些凭证」（列表内 OR、对象内 AND）；
    它无法表达随部署模式变化的外层门禁，因此门禁逐操作写在 x-e1-gate，服务端发布的文档与之一一对应。
  evaluation-order: 门禁 → 身份 → 角色 → 对象归属 → CSRF/Origin
  modes:
    local: 无门禁；身份仍按 security 判定（无效 demo cookie 在同一层回 401 DEMO_SESSION_INVALID）。
    restricted: 要求签名有效的 huice_demo_session（DemoSession）；缺失、格式/签名不对、已过期都回同一个
      403 DEMO_SESSION_REQUIRED，且先于身份判定——连 security 为空的注册/登录也不例外。
  exempt:
  - GET /health
  - POST /auth/logout
  exempt-note: 只有这两项。健康检查本来就公开；登出只撤销调用者自己出示的那一个会话——
    要求有效凭证会让过期会话再也清不掉 Cookie。
  reference: contracts/openapi.e1-draft.yaml 的 x-e1-gate-model（门禁/身份真值表、错误码与可复核的请求样例）
paths:
  /health:
    get:
      operationId: getHealth
      summary: API-01
      description: ''
      tags:
      - public
      security: []
      x-e1-gate:
        local: none
        restricted: exempt
        note: 门禁豁免（仅 GET /health 与 POST /auth/logout 两项）；身份仍按 security 判定，restricted 下错误的 demo cookie 也不会在这里被 403。
      parameters: []
      responses:
        '200':
          description: 成功
          headers:
            X-Trace-Id: &id001
              description: Request trace UUID; error body uses the same value.
              schema: &id028
                $ref: '#/components/schemas/UUID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: 1.0.0-rc.8
        default:
          $ref: '#/components/responses/ApiFailure'
        '400': &id004
          description: 请求语法或查询参数错误
          content:
            application/json:
              schema: &id002
                $ref: '#/components/schemas/ApiError'
          headers: &id003
            X-Trace-Id: *id001
        '401': &id005
          description: 未认证
          content:
            application/json:
              schema: *id002
          headers: *id003
        '403': &id006
          description: 权限不足
          content:
            application/json:
              schema: *id002
          headers: *id003
        '500': &id007
          description: 内部错误（脱敏）
          content:
            application/json:
              schema: *id002
          headers: *id003
        '503': &id008
          description: 依赖不可用
          content:
            application/json:
              schema: *id002
          headers: *id003
  /policies:
    get:
      operationId: listPolicies
      summary: API-02
      description: Published/closed only. Omitted status includes both. asOf is an optional metadata filter, not
        a historical-version selector.
      tags:
      - public
      security:
      - UserSession: []
      - DemoSession: []
      x-e1-gate:
        local: none
        restricted: DemoSession
        note: restricted 部署下先过 demo 门禁（同一个 huice_demo_session cookie）；缺失、破损或过期一律 403 DEMO_SESSION_REQUIRED，先于身份判定。
      parameters:
