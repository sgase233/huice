  /assessment-runs:
    get:
      operationId: listRuns
      summary: AUTH-07
      tags:
      - public
      security:
      - UserSession: []
      - DemoSession: []
      x-e1-gate:
        local: none
        restricted: DemoSession
        note: 同 AUTH-06：先门禁后身份，403 与 401 不互换。
      description: |
        支持历史分析与报告导航，不能只依赖浏览器保存的 `runId`。归属过滤在服务端：
        企业用户只看本人企业的 run，审核员看全部，demo 只看无主企业的 run，Bearer 403。

        `enterpriseId` 只是筛选，**不放宽可见范围**（先定可见集，再在可见集里筛）：

        | 身份 | 不传 `enterpriseId` | 传本人/可筛企业 | 传其他身份的企业 | 传不存在的 UUID |
        | --- | --- | --- | --- | --- |
        | 企业用户 | 本人企业的 run | 200 | 404 `ENTERPRISE_NOT_FOUND` | 404 `ENTERPRISE_NOT_FOUND` |
        | 审核员 | 全部 run（含无主企业） | 200，该企业的 run | 200（审核员可筛任意企业） | 404 `ENTERPRISE_NOT_FOUND` |
        | demo | 无主企业的 run | 200（仅无主企业） | 404 `ENTERPRISE_NOT_FOUND`（有主企业一律不可见） | 404 `ENTERPRISE_NOT_FOUND` |
        | Bearer | — | — | — | 403 `ROLE_FORBIDDEN`（不进入筛选） |

        「其他身份的企业」与「不存在的 UUID」返回**同一个** 404、同一文案，调用方无法据此判断企业是否存在；
        传本人企业但本地无 run 时返回 `200` + 空 `items`，不是 404。

        `status` 是 E1 新增的生命周期字段（D5.3）。**E1 只承诺四个取值**
        `queued/running/succeeded/failed`，且 E1 不产生 `interrupted`：
        - E1 之前的历史记录只可能是 `succeeded`（旧实现仅在成功后插行），旧数据按 `succeeded`
          返回，不补造失败记录，也不把 `created_at == finished_at` 当成 0 毫秒耗时；
        - `queued` 只出现在 E1 起的新写入路径上（受理即落行），E1 之前没有 `queued`。

        **`interrupted` 是 E3b 的扩展，不在本草案的枚举里**：D5.3 的启动扫描（`running` 记录早于
        运行上限、advisory lock 无人持有、原连接已断开，三者同时满足才置 `interrupted`）随 E3b 落地。
        E1 不做启动扫描，进程崩溃留下的孤儿 `running` **保持 `running`**，不自动改写。

        `enum` 是封闭集合（见 `RunStatus`），所以 E1 服务端**保证不产生**这四个值以外的字符串；
        E3b 增加 `interrupted` 时必须同时升契约版本、重新生成前端类型并同窗发布，
        不存在「后端先上新枚举、前端靠兜底接住」的允许组合。
        前端仍建议对未识别值做防御性降级（不当作 `succeeded`、不给报告入口、不自动重跑），
        但那只是滚动升级窗口的保险，不是契约承诺。

        失败、未完成与被中断的 run **都可以出现在列表里**，但**不提供报告下载**。
        是否给 `interrupted` 单列一个错误码（而不是复用 409 `RUN_NOT_COMPLETED`）留待共同评审，
        见 `x-open-questions`。
      parameters:
        - name: enterpriseId
          in: query
          required: false
          description: >-
            只做筛选，不放宽可见范围：先按身份定可见集，再在可见集里筛。可筛范围见操作说明的表。
            不在可筛范围内时一律 404 `ENTERPRISE_NOT_FOUND`（筛选对象是企业），**不区分「企业不存在」
