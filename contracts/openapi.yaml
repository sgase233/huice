                    comparator: lte
                    value: '3000000.00'
                    unit: CNY
                  sourceSpans: &id047
                  - sourceId: 44444444-4444-4444-8444-444444444444
                    sourceUrl: https://www.gov.cn/
                    sourceVersion: demo-v1
                    page: null
                    section: 合成演示条款
                    quote: 此处仅为接口结构演示，不是真实政策。
                    textHash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  reviewFinding: none
                  validationStatus: passed
                preparationTemplate: &id023
                  type: tax
                  handlingMode: tax_self_assessment
                  officialEntryUrl: https://www.gov.cn/
                  deadline: null
                  items: []
        default:
          $ref: '#/components/responses/ApiFailure'
        '400': *id004
        '401': *id005
        '403': *id006
        '404': &id013
          description: 记录不存在
          content:
            application/json:
