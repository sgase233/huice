                issuer: 演示发布者
                region: '440300'
                version: demo-v1
                status: published
                effectiveFrom: '2026-01-01'
                effectiveTo: null
                applicationWindow: null
                sourceUrl: https://www.gov.cn/
                documentNumber: null
                applicableEntities: &id009
                - 合成企业
                publishedAt: '2026-01-01'
                officialEntryUrl: https://www.gov.cn/
                sources: &id010
                - id: 44444444-4444-4444-8444-444444444444
                  kind: body
                  sourceUrl: https://www.gov.cn/
                  title: 合成演示原文
