        reportAvailable:
          type: boolean
          description: 只有 succeeded 且结果快照完整时为 true；未完成/失败的 run 不给报告下载。
    RunSummaryList:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
