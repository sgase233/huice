          maxLength: 64
          description: >-
            只做规范化（去首尾空白、转小写）后查账号，**不**套注册的 3—32 位与字符集规则：
            长度或字符不合规的名字不可能命中任何账号，统一回 401 INVALID_CREDENTIALS，
            不借登录接口暴露「这个名字格式对不对、存不存在」。上限 64 只是请求体健全性检查。
        password:
          type: string
