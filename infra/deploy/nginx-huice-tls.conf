# Purpose: expose the Huice API over TLS on 443 of the ECS instance (M1).
# Install: /etc/nginx/conf.d/huice-api-tls.conf  (see infra/deploy/README.md §3.2)
# Notes: 自签证书，仅用于 ICP 备案前的评审演示；放在 /etc/huice/tls，不进仓库。
#        80 端口的 huice-api.conf 保留不动，健康检查与 curl 冒烟继续走 80。
#        nginx 1.24 不支持 `http2 on;`（1.25.1 才有），需要 HTTP/2 时在 listen 上加参数。

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/huice/tls/huice.crt;
    ssl_certificate_key /etc/huice/tls/huice.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # API-04 accepts up to 5 files × 10 MiB; leave room for multipart overhead.
    client_max_body_size 60m;
    client_body_timeout 60s;

    server_tokens off;

    access_log /var/log/nginx/huice-api.access.log;
    error_log  /var/log/nginx/huice-api.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_request_buffering off;
    }
}
