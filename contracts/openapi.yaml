        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactUpdate'
  /assessment-runs:
    post:
      operationId: createRun
      summary: API-11
      description: Synchronous immutable snapshot. Resolve currently published versions, never draft versions. History
        creates a new run ID.
      tags:
      - public
      security:
      - DemoSession: []
      parameters: []
      responses:
        '200':
          description: 成功
          headers:
            X-Trace-Id: *id001
          content:
            application/json:
              schema: &id024
                $ref: '#/components/schemas/AssessmentRun'
              example: &id025
                id: 55555555-5555-4555-8555-555555555555
                enterpriseId: 11111111-1111-4111-8111-111111111111
                period: *id019
                asOf: '2026-10-23T10:00:00+08:00'
                createdAt: '2026-10-23T02:00:00Z'
                policyVersionMap:
                  22222222-2222-4222-8222-222222222222: demo-v1
                factVersion: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                ruleVersion: rules-demo-v1
                supersedesRunId: null
                assessments:
                - policyId: 22222222-2222-4222-8222-222222222222
                  result: insufficient_evidence
                  validity: current
                  staleReasons: []
                  criteriaResults:
                  - criterionId: 33333333-3333-4333-8333-333333333333
                    result: insufficient_evidence
                    reason: 缺少演示事实
                    factRefs:
                    - &id022
                      key: taxableIncome
                      period: *id019
                    evidenceRefs:
                    - policyId: 22222222-2222-4222-8222-222222222222
                      sourceId: 44444444-4444-4444-8444-444444444444
                      sourceUrl: https://www.gov.cn/
                      sourceVersion: demo-v1
                      page: null
                      section: 合成演示条款
                      quote: 此处仅为接口结构演示，不是真实政策。
                      textHash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                    calculation: null
                  missingFacts:
                  - *id022
                  nextQuestion:
                    factRef: *id022
                    prompt: 请补充演示年度应纳税所得额
                    reason: 用于演示条件求值
                    rank: 1
                  validUntil: null
                  preparation: *id023
                  explanation: 合成样例；缺失事实不能作肯定判断。
                  explanationMode: fixture
                  warnings:
                  - 仅为结构演示；非税务专业意见。
        default:
          $ref: '#/components/responses/ApiFailure'
        '400': *id004
        '401': *id005
        '403': *id006
        '409': *id014
        '422': *id015
        '429': *id016
        '500': *id007
        '503': *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentInput'
  /assessment-runs/{runId}:
    get:
      operationId: getRun
      summary: API-12
      description: Preserve snapshot; resolve per-assessment validity/staleReasons against current events/time.
      tags:
      - public
      security:
      - DemoSession: []
      parameters:
      - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: 成功
          headers:
            X-Trace-Id: *id001
          content:
            application/json:
              schema: *id024
              example: *id025
        default:
          $ref: '#/components/responses/ApiFailure'
        '400': *id004
        '401': *id005
        '403': *id006
        '404': *id013
        '500': *id007
        '503': *id008
  /assessment-runs/{runId}/report.md:
    get:
      operationId: downloadReport
      summary: API-13
      description: UTF-8 Markdown, immutable historical body plus current download validity notice. Errors remain
