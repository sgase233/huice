      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-z0-9_.-]{3,32}$'
          description: >-
            3—32 位，只允许 a-z、0-9、下划线、点、连字符。服务端先去首尾空白再转小写，
            之后才套上面这条规则，所以 ' ACME.Two ' 与 acme.two 是同一个名字；不合规一律
            422 VALIDATION_ERROR（details.fieldErrors[].field = username）。
            本规则与实现同源（app/auth.py 的 USERNAME_PATTERN，库表 CHECK 也是这一条），
            契约不会接受一个服务端随后拒掉的值。
        password:
          type: string
