              criteriaDrafts:
              - id: 99999999-9999-4999-8999-999999999999
                title: 小微企业减计应纳税所得额
                expression:
                  op: industry_exclusion
                  factKey: industry
                  period: assessment
                  excluded:
                  - '03'
                  - '04'
                sourceSpans:
                - sourceId: 77777777-7777-4777-8777-777777777777
                  sourceUrl: https://www.gov.cn/zhengce/content/2026-11/12/content_0000001.htm
                  sourceVersion: candidate
                  page: null
                  section: 一
                  quote: 对符合条件的小微企业，按年度应纳税所得额不超过 300 万元的部分减按 5% 计入应纳税所得额。
                  textHash: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
                reviewFinding: none
      responses:
        '200':
