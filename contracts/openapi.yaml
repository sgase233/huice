                - key: industry
                  value: C39
                  unit: code
                  period: *id019
                  source: user_input
                  verified: false
                - key: taxableIncome
                  value: null
                  unit: CNY
                  period: *id019
                  source: user_input
                  verified: false
                factVersion: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        default:
          $ref: '#/components/responses/ApiFailure'
        '400': *id004
        '401': *id005
        '403': *id006
        '409': *id014
        '422': *id015
        '429': *id016
        '500': *id007
        '503': *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterpriseInput'
  /enterprises/{enterpriseId}:
    get:
      operationId: getEnterprise
      summary: API-09
      description: ''
      tags:
      - public
      security:
      - DemoSession: []
      parameters:
      - $ref: '#/components/parameters/enterpriseId'
      responses:
        '200':
          description: 成功
          headers:
