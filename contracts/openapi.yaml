    PolicyStatus:
      type: string
      enum:
      - published
      - closed
    DraftStatus:
      type: string
      enum:
      - pending_parse
      - pending_review
      - published
      - closed
    PolicyType:
      type: string
      enum:
      - tax
      - grant
    AgentStatus:
      type: string
      enum:
      - ok
      - needs_review
      - retryable_error
      - fatal_error
    FactSource:
      type: string
      enum:
      - user_input
      - synthetic_material
    Comparator:
      type: string
      enum:
      - lt
      - lte
      - eq
      - gte
      - gt
      - ne
    FactRef:
      type: object
      additionalProperties: false
      required:
      - key
      - period
      properties:
        key: *id030
        period: &id031
          $ref: '#/components/schemas/Period'
    FactInput:
      type: object
      additionalProperties: false
      required:
      - key
      - value
      - unit
      - period
      - source
      properties:
        key: *id030
        value: &id032
          oneOf:
          - type: string
          - type: boolean
          - type: 'null'
        unit: &id033
          $ref: '#/components/schemas/FactUnit'
        period: *id031
        source: &id034
          $ref: '#/components/schemas/FactSource'
      if:
        properties:
          key:
            enum:
            - region
            - industry
      then:
        properties:
          value:
            anyOf:
            - type: string
              minLength: 1
            - type: 'null'
          unit:
            const: code
      else:
        if:
          properties:
            key:
              enum:
              - establishedDate
        then:
          properties:
            value:
              anyOf:
              - *id029
              - type: 'null'
            unit:
              const: date
        else:
          if:
            properties:
              key:
                enum:
                - taxableIncome
