        note: restricted 下也要过门禁（没有邀请就不提供注册入口）；失败 403 DEMO_SESSION_REQUIRED。门禁先于请求体解析与字段校验：缺 cookie 时即使请求体缺字段/类型不对/为空/不是 JSON，也是 403 而不是 422。
      description: |
        事务内创建账号与（企业用户必填的）唯一企业，两者同成同败：任何一步失败都回滚，
        不留下半个账号或半个企业。默认**不自动登录**，须再调 AUTH-02。

        **注册不消费会话 Cookie**：浏览器会自动带上已有的 `huice_session`（HttpOnly，前端删不掉），
        本操作**忽略**它——不校验、不撤销、也不因此返回 401（例外清单见 `info` 的判定顺序段）。
        注册成功后当前会话保持不变（还是原来的账号）；要切到新账号，前端应先调 AUTH-03 再调 AUTH-02，
        不能靠「直接再注册一次」切换。

        `reviewerSignupKey` 与 `enterprise` 的组合（同一事务内判定，失败即回滚）：

        | 请求 | 角色 | 响应 | 事务结果 |
        | --- | --- | --- | --- |
        | 不提供密钥，带 `enterprise` | enterprise | 201 | 建账号 + 建企业并绑定 |
        | 不提供密钥，不带 `enterprise` | — | 422 `VALIDATION_ERROR` | 无任何写入 |
        | 提供密钥但为空或短于 16 字符 | — | 422 `VALIDATION_ERROR`（schema 层拦截） | 无任何写入 |
        | 提供长度合法但错误的密钥 | — | 403 `ROLE_FORBIDDEN` | 无任何写入，也不建企业 |
        | 提供有效密钥，带 `enterprise` | reviewer | 201 | 建账号 + 建企业并绑定 |
        | 提供有效密钥，不带 `enterprise` | reviewer | 201 | 只建账号，企业留到首次调用 API-08 时创建 |

        - 密钥错误与「该部署根本没有配置密钥」返回**同一个** 403 与同一文案，不回显细节，
          也不告诉调用方密钥是否正确。
        - 不接受客户端指定 `role`：角色只由「是否提供有效密钥」决定，服务端裁定。
        - **Origin 必须存在且与 `PUBLIC_ORIGIN` 同源**，缺失或不匹配一律 403 `ORIGIN_MISMATCH`（D1.6）。
        - 限流：IP 维度 5 次/分钟；连续 20 次失败锁 15 分钟（只锁 IP，不锁用户名）。
        - **本操作没有 401 分支**：不校验任何凭证，也不会因为「带了失效会话」而失败。
          403 只来自门禁、Origin 与密钥，409 只来自用户名冲突（`USERNAME_TAKEN`）。
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              enterpriseUser:
                summary: 企业用户（必填企业信息）
                value:
                  username: acme-2026
                  password: correct horse battery staple
                  enterprise:
                    nameSynthetic: 合成企业A
                    period:
                      startDate: '2026-01-01'
                      endDate: '2026-12-31'
                    facts:
                    - key: region
                      value: '440300'
                      unit: code
                      period:
                        startDate: '2026-01-01'
                        endDate: '2026-12-31'
                      source: user_input
                    - key: industry
                      value: C39
                      unit: code
                      period:
                        startDate: '2026-01-01'
                        endDate: '2026-12-31'
                      source: user_input
              reviewer:
                summary: 审核员（不带企业、带注册密钥）
                value:
                  username: reviewer-01
                  password: correct horse battery staple
                  reviewerSignupKey: <由部署方通过机密渠道提供，不在仓库与日志中出现>
      responses:
        '201':
          description: 已创建；响应不含密码哈希、注册密钥或会话凭据
          headers:
            X-Trace-Id: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                ok:
                  value:
                    user:
                      id: 77777777-7777-4777-8777-777777777777
                      username: acme-2026
                      role: enterprise
                      enterpriseId: 11111111-1111-4111-8111-111111111111
        '400': *id004
        '403': *id006
        '409': *id014
        '422': *id015
        '429': *id016
        '500': *id007
        '503': *id008
        default:
          $ref: '#/components/responses/ApiFailure'
  /auth/login:
    post:
      operationId: loginUser
      summary: AUTH-02
      tags:
      - auth
      security: []
      x-e1-gate:
        local: none
        restricted: DemoSession
        note: restricted 下也要过门禁；失败 403 DEMO_SESSION_REQUIRED，不进入凭据校验、不计入锁定计数，也不等请求体校验。
      description: |
        成功后下发会话 Cookie `huice_session`（`HttpOnly; Secure; SameSite=Lax; Path=/api`；
        `APP_ENV=local` 时关闭 `Secure`），同时返回 `csrfToken`，后续写请求走 `X-CSRF-Token`。

        **Origin 必须存在且与 `PUBLIC_ORIGIN` 同源**，缺失或不匹配一律 403 `ORIGIN_MISMATCH`
        （D1.6 第一行：此时还没有已认证状态，所以不要求 CSRF，但只要 Origin）。这条与 AUTH-01 相同，
        不因「登录本身不改变服务端状态」而省略——登录会下发会话 Cookie，属于 CSRF 的目标。

        **登录也不消费会话 Cookie**：请求里带的**有效**会话会被撤销并换成新会话（同一浏览器不留两个
        活会话，也避免会话固定）；**无效或已过期的会话直接忽略**，不会被当成「提供了无效凭证」而 401。
        否则用户会话一过期就再也无法重新登录。因此本操作**没有 `SESSION_INVALID` / `TOKEN_INVALID`
        分支**：401 只表示账号密码错误（`INVALID_CREDENTIALS`），Bearer 同样被忽略。

        账号不存在与密码错误使用**同一个** 401 `INVALID_CREDENTIALS` 与同一提示文案，
        响应不透露账号是否存在。限流与锁定同 AUTH-01（IP 维度，`username` 只计数不锁定，
        避免他人恶意锁死某个账号）。

        restricted 部署下，门禁先于凭据校验：没有有效 demo cookie 时直接 403
        `DEMO_SESSION_REQUIRED`，不校验账号密码、也不消耗失败次数。
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              enterpriseUser:
                summary: 企业用户（浏览器同源请求，Origin 见参数）
                value:
                  username: acme-2026
                  password: correct horse battery staple
      responses:
        '200':
          description: 登录成功；`Set-Cookie` 下发 `huice_session`
          headers:
            X-Trace-Id: *id001
            Set-Cookie:
              description: >-
                huice_session=<token>; HttpOnly; Secure; SameSite=Lax; Path=/api; Max-Age=<ttl>。
                local 模式不带 Secure。令牌明文只出现在这里，服务端只存 sha256。
              schema:
                type: string
            Cache-Control:
              description: 响应禁止缓存。
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              examples:
                ok:
                  value:
                    user:
                      id: 77777777-7777-4777-8777-777777777777
                      username: acme-2026
                      role: enterprise
                      enterpriseId: 11111111-1111-4111-8111-111111111111
                    expiresAt: '2026-11-10T22:00:00Z'
                    csrfToken: 9f2c1d0e5b6a4c7d8e9f0a1b2c3d4e5f
        '400': *id004
        '401':
          description: 凭据错误（账号不存在与密码错误不区分）
          headers:
            X-Trace-Id: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalid:
                  value:
                    error:
                      code: INVALID_CREDENTIALS
                      message: 用户名或密码错误。
                      details: {}
                    traceId: 11111111-1111-4111-8111-111111111111
        '403': *id006
        '422': *id015
        '429': *id016
        '500': *id007
        '503': *id008
        default:
          $ref: '#/components/responses/ApiFailure'
  /auth/logout:
    post:
      operationId: logoutUser
      summary: AUTH-03
      tags:
      - auth
      security: []
      x-e1-gate:
        local: none
        restricted: exempt
        note: 豁免演示门禁；否则 demo cookie 一过期就无法登出、也清不掉 Cookie。
      x-e1-credential-rule:
        exception: 本操作不适用「提供但无效一律 401」；无效会话按「无会话」处理并返回 204。
      description: |
        撤销**调用者自己出示的那一个**会话并清除 Cookie，`204`，无响应体。
        它不查询也不撤销其他会话，因此**无效会话也返回 204**，不返回 401——
        这是全局「提供的凭证无效一律 401」的**显式例外**，只适用于本操作。

        | 传入的 `huice_session` | 服务端动作 | `X-CSRF-Token` | `Origin` | 响应 |
        | --- | --- | --- | --- | --- |
        | 未提供 | 不查库、不修改任何行 | 不需要 | 不校验 | `204` + 清 Cookie |
        | 提供但格式不对 / 不存在 / 已过期 / 已撤销 | 视同「无有效会话」：不查不到就不动，返回成功 | 不需要 | 不校验 | `204` + 清 Cookie |
        | 有效 | 置 `revoked_at`，撤销这一个会话 | **必填**，缺失或不匹配 → `403 CSRF_REQUIRED` | 必须与 `PUBLIC_ORIGIN` 同源，否则 `403 ORIGIN_MISMATCH` | `204` + 清 Cookie |

        - **清 Cookie**：三种情形都在响应里带 `Set-Cookie: huice_session=; Path=/api; Max-Age=0`
          （local 模式无 `Secure`，与下发时一致），否则浏览器会继续带着死值重试。
        - **CSRF 只在有效会话时需要**：没有有效会话时既没有可被冒用的状态、也没有可比的
          `csrfToken`，此时强求 CSRF 只会让「会话过期后收尾」失败。有有效会话时缺 CSRF
          → `403 CSRF_REQUIRED`，且**不撤销**任何东西（先校验后动作）。
        - **不含 401**：本操作没有 401 分支；错误只可能来自 CSRF/Origin（403）或服务端（5xx）。
        - **403 的优先级与副作用**：有效会话下若 `Origin` 与 `X-CSRF-Token` 同时不对，
          先返回 `403 ORIGIN_MISMATCH`（Origin 说明请求根本不该到这里，先于令牌比对）；
          只有在同源成立后才可能是 `403 CSRF_REQUIRED`。**403 时不撤销会话、不下发 `Set-Cookie`**：
          被拒的请求不产生任何状态变化，「登出失败」不会顺手把用户踢下线。
        - **与门禁的关系**：restricted 下本操作豁免 `DemoSession` 门禁；带 Bearer 或同时带
          demo cookie 时不改变行为，也不撤销 Bearer 或 demo 所代表的任何东西。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/OriginHeaderOptional'
      responses:
        '204':
          description: 已登出；无论原本是否有效（无有效会话时不产生任何服务端改动）
          headers:
            X-Trace-Id: *id001
            Set-Cookie:
              description: huice_session=; Path=/api; Max-Age=0
              schema:
                type: string
        '403': *id006
        '500': *id007
        '503': *id008
        default:
          $ref: '#/components/responses/ApiFailure'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: AUTH-04
      tags:
      - auth
      security:
      - UserSession: []
      x-e1-gate:
        local: none
        restricted: DemoSession
        note: restricted 下先过门禁；门禁缺失是 403，会话无效才是 401，两者不互换。
      description: |
        刷新页面后恢复登录态与 `enterpriseId`；返回与 AUTH-02 相同的 `csrfToken`（首版不轮换）。
        响应禁止缓存。会话过期或已撤销一律 401，不降级到 demo 或 Bearer。

        **两种失败要分开处理**（restricted 部署）：
        - `403 DEMO_SESSION_REQUIRED`：外层门禁失效——回演示入口重新拿 demo cookie，
          **会话本身可能还有效**，不要直接清掉并跳登录页；
        - `401 SESSION_INVALID` / `401 UNAUTHENTICATED`：会话本身失效——跳登录页，
          登录（AUTH-02）会覆盖旧 Cookie，不需要前端先删。
        local 部署没有门禁，只可能出现 401。
      responses:
        '200':
          description: 当前会话
          headers:
            X-Trace-Id: *id001
            Cache-Control:
              description: 响应禁止缓存。
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              examples:
                reviewer:
                  value:
                    user:
                      id: 88888888-8888-4888-8888-888888888888
                      username: reviewer-01
                      role: reviewer
                      enterpriseId: null
                    expiresAt: '2026-11-10T22:00:00Z'
                    csrfToken: 9f2c1d0e5b6a4c7d8e9f0a1b2c3d4e5f
        '401': *id005
        '403': *id006
        '500': *id007
        '503': *id008
        default:
          $ref: '#/components/responses/ApiFailure'
  /auth/password:
    post:
      operationId: changePassword
      summary: AUTH-05
      tags:
      - auth
      security:
      - UserSession: []
      x-e1-gate:
        local: none
        restricted: DemoSession
        note: restricted 下先过门禁，再验会话；缺 CSRF/Origin 是 403，会话无效是 401。门禁先于请求体解析：缺 cookie 时请求体不合法也是 403。
      description: |
        校验旧密码后更新哈希，并**立即撤销该账号的全部会话**（含当前会话），清 Cookie；
        用户须重新登录。没有「替他人改密」的接口，审核员也不能重置他人密码。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: 已更新；全部会话已撤销
          headers:
            X-Trace-Id: *id001
            Set-Cookie:
              description: huice_session=; Path=/api; Max-Age=0
              schema:
                type: string
        '400': *id004
        '401': *id005
        '403': *id006
        '422': *id015
        '500': *id007
        '503': *id008
        default:
          $ref: '#/components/responses/ApiFailure'
components:
  securitySchemes:
    DemoSession:
      type: apiKey
      in: cookie
      name: huice_demo_session
      description: restricted gateway only; HttpOnly Secure SameSite=Lax cookie. Local loopback mode bypasses this
        scheme only.
    AdminBearer:
      type: http
      scheme: bearer
      description: Runtime-only ADMIN_TOKEN; E1 起**只读**（后台读接口与轨迹），任何写操作都用 UserSession；never VITE/localStorage.
    UserSession:
      type: apiKey
      in: cookie
      name: huice_session
      description: 登录会话（HttpOnly、可撤销、只存令牌摘要）。E1 起是唯一可写的身份；运维 Bearer 只读。
  parameters:
    policyId:
      name: policyId
      in: path
      required: true
      schema: *id028
    enterpriseId:
      name: enterpriseId
      in: path
      required: true
      schema: *id028
    runId:
      name: runId
      in: path
      required: true
      schema: *id028
    factKey:
      name: factKey
      in: path
      required: true
      schema: &id030
        $ref: '#/components/schemas/FactKey'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[^"\r\n]+"$
      description: Strong quoted token from latest read. Missing=428; mismatch=409; no * or W/.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *id028
      description: Extraction only. Same body/key replays committed result without charging twice, unless draft
        has since changed.
    Version:
      name: version
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    PolicyType:
      name: type
      in: query
      required: false
      schema: &id053
        $ref: '#/components/schemas/PolicyType'
    PublicStatus:
      name: status
      in: query
      required: false
      schema: &id056
        $ref: '#/components/schemas/PolicyStatus'
    AdminStatus:
      name: status
      in: query
      required: false
      schema: &id073
        $ref: '#/components/schemas/DraftStatus'
    Region:
      name: region
      in: query
      required: false
      description: '行政区划码（如 440300）。按该区划筛同时包含全国性政策：全国性政策
        的 region 记 `CN`，不随区划码变化。只查全国性政策请直接传 `CN`。'
      schema:
        type: string
        minLength: 1
    AsOf:
      name: asOf
      in: query
      required: false
      schema: &id035
        $ref: '#/components/schemas/Timestamp'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: >-
        **带有效会话 Cookie 的写请求**必填，缺失或与会话内 csrfToken 不一致返回 403 CSRF_REQUIRED；
        有会话时同时校验 Origin 与 PUBLIC_ORIGIN 同源，不匹配 403 ORIGIN_MISMATCH。
        写请求分四类（D1.6）：注册/登录只校验 Origin、不要求 CSRF；带会话的写请求两者都要；
        带 demo cookie 的写请求要 Origin（+Referer）但不要求 CSRF；带 Bearer 或不带凭证的
        CLI/curl 请求两者都不校验。AUTH-03 登出在没有有效会话时不要求 CSRF。
      schema:
        type: string
        minLength: 16
    OriginHeader:
      name: Origin
      in: header
      required: true
      description: >-
        必须是 PUBLIC_ORIGIN 的确切源（scheme + host + port，不带路径与末尾斜杠）。
        缺失或不匹配一律 403 ORIGIN_MISMATCH（D1.6）。浏览器会自动带上；curl/脚本需显式提供。
      schema:
        type: string
        format: uri
    OriginHeaderOptional:
      name: Origin
      in: header
      required: false
      description: >-
        有有效会话时必填并校验同源（否则 403 ORIGIN_MISMATCH）；无有效会话时不校验。
        仅用于 AUTH-03 登出这类「无效会话也成功」的操作。
      schema:
        type: string
        format: uri
  responses:
    ApiFailure: *id007
  schemas:
    UUID:
      type: string
      format: uuid
    Date:
      type: string
      format: date
    Timestamp:
      type: string
      format: date-time
    DecimalString:
      type: string
