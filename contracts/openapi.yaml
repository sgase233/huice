      - $ref: '#/components/schemas/OrExpression'
      - $ref: '#/components/schemas/NotExpression'
      - $ref: '#/components/schemas/CompareExpression'
      - $ref: '#/components/schemas/DateExpression'
      - $ref: '#/components/schemas/IndustryExclusionExpression'
      - $ref: '#/components/schemas/QuarterlyAverageExpression'
