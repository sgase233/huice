    PreparationItem:
      type: object
      additionalProperties: false
      description: |
        一条办理材料。`missing` 只说「不能认为材料齐了」，`status` 说清楚为什么，两者
        不重复：`manual_check`（没有事实键、本来就判断不了）与 `facts_missing`（有事实
        键但还没取值）在页面上必须显示成两句不同的话，不能都写成「资料缺失」。
        `status` 一律是**事实口径**：服务端只读企业事实，不读材料本身，所以它答不了
        「这份材料交了没有」——`facts_filled` 只表示「要证明的事实都有取值」。
      required:
      - materialId
      - title
      - description
      - requiredFactRefs
      - missing
      - status
      properties:
        materialId:
          type: string
          description: 材料代号（如 `TAX-01`），与 `data/policies/material_requirements.csv` 一致。
        title:
          type: string
          description: 已带「【必交】/【条件交】」前缀的材料名称。
        description:
          type: string
          description: 办理说明；条件交材料在末尾附「何时需要」。
        requiredFactRefs:
          type: array
          items: *id052
          description: 这份材料证明的事实；季度类键已展开成具体季度，不是「年度」占位。
        missing:
          type: boolean
          description: 保守口径——`manual_check` 也算 `true`（不认为材料齐了）。展示请以 `status` 为准。
        status:
          type: string
          enum:
          - facts_filled
          - facts_missing
          - manual_check
          - policy_closed
          description: |
            - `facts_filled`：这份材料要证明的事实都已有取值。**不代表材料已提交或已核验**，
              也不代表这些取值是对的——服务端只读到「有值」；
            - `facts_missing`：有事实键，但至少一个还没取值（缺的是事实，不是材料本身）；
            - `manual_check`：这份材料没有事实键（如申请书），程序判断不了，需人工核对；
            - `policy_closed`：政策已到期或申报窗口已关，材料不再提交。
