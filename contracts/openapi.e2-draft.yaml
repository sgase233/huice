              schema:
                $ref: '#/components/schemas/CandidateDetail'
        '400': *e400
        '401': *e401
        '403': *e403
        '404': *e404
        '409': *e409
        '422': *e422
        '428': *e428
        '500': *e500
        '503': *e503

  /admin/policy-candidates/{candidateId}/submit:
    post:
      operationId: submitPolicyCandidate
      summary: DISC-07
      description: >-
        把候选提交为**政策草稿**（status=pending_review，不走自动发布）。这是候选进入政策库的
        唯一入口，且复用 API-04—API-07 的落库链路：同一事务内写政策版本与来源、写条件与校验
        结果、标记候选 submitted、写幂等记录；任一步失败整体回滚并删除刚写入的对象存储。

        前置条件（任一不满足即拒绝，不落任何数据）：候选为 pending_review、修订号与 If-Match
        一致、missingFields 为空、至少一条结构化条件通过校验。

        幂等：同一个 Idempotency-Key 对同一候选同一修订号重放时，直接返回首次创建的草稿
        （201 语义按重放返回 200 的旧版式并不存在——响应码仍为 201，body 与 ETag 与首次一致）；
        同键不同候选/不同修订号返回 409 IDEMPOTENCY_KEY_REUSED。作用域按**操作**划分（与
        API-03 的 extract 一致），不含操作者：候选是全体审核员共享的资源，另一个审核员撞上同一
        个键时，同候选同修订号拿到的是同一份草稿，换候选则明确 409，不会悄悄建出第二份。
        候选一旦已是 submitted，无论带不带幂等键都返回 409 CANDIDATE_STATE_CONFLICT 并带上
        已提交的 policyId/version，不重复建版本。

        候选的 attachmentUrls 非空时，草稿的 validationFindings 里会多一条 criterionId 为 null 的
        ATTACHMENT_NOT_EXTRACTED：附件首版不下载、不解析，提示必须跟着草稿走到发布复核。

        候选条件里的 sourceSpans.sourceVersion 在提交时由 "candidate" 改挂为新建的版本号、
        sourceId 改挂为新来源 id——引文与 textHash 不变，证据不被改写。
      tags:
      - admin
      security:
      - UserSession: []
      x-e1-gate:
        local: none
        restricted: DemoSession
        note: restricted 部署下先过 demo 门禁（同一个 huice_demo_session cookie）；缺失、破损或过期一律 403 DEMO_SESSION_REQUIRED。门禁在解析请求体之前执行，先于字段校验也先于身份判定——缺 cookie 时请求体不合法同样是 403，不是 422。
      parameters:
      - $ref: '#/components/parameters/CandidateId'
      - $ref: ./openapi.yaml#/components/parameters/IfMatch
      - $ref: ./openapi.yaml#/components/parameters/IdempotencyKey
      - $ref: ./openapi.yaml#/components/parameters/CsrfToken
      requestBody:
        required: false
        description: 无请求体。候选的身份由路径给出，修订号由 If-Match 给出。
      responses:
        '201':
          description: 已创建草稿（重放同一幂等键也返回 201，body 与 ETag 与首次一致）
          headers: *e200_headers
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/PolicyDraft
        '400': *e400
        '401': *e401
        '403': *e403
        '404': *e404
        '409': *e409
        '422': *e422
        '428': *e428
        '500': *e500
        '503': *e503

  /admin/policy-candidates/{candidateId}/discard:
    post:
      operationId: discardPolicyCandidate
      summary: DISC-08
      description: >-
        丢弃候选（终态）。只对 pending_review / extraction_failed 有效；可带一条原因。
        丢弃后不进入政策库，也不会被下一轮轮转改状态。响应体是丢弃后的候选详情。
      tags:
      - admin
      security:
      - UserSession: []
      x-e1-gate:
        local: none
        restricted: DemoSession
        note: restricted 部署下先过 demo 门禁（同一个 huice_demo_session cookie）；缺失、破损或过期一律 403 DEMO_SESSION_REQUIRED。门禁在解析请求体之前执行，先于字段校验也先于身份判定——缺 cookie 时请求体不合法同样是 403，不是 422。
      parameters:
      - $ref: '#/components/parameters/CandidateId'
      - $ref: ./openapi.yaml#/components/parameters/IfMatch
      - $ref: ./openapi.yaml#/components/parameters/CsrfToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscardCandidateInput'
            example:
              reason: 与既有政策重复，不需要新建版本。
      responses:
        '200':
          description: 已丢弃
          headers: *e200_headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDetail'
        '400': *e400
        '401': *e401
        '403': *e403
        '404': *e404
        '409': *e409
        '422': *e422
        '428': *e428
        '500': *e500
        '503': *e503

components:
  securitySchemes:
    UserSession:
      type: apiKey
      in: cookie
      name: huice_session
      description: 账号会话。E1 起是唯一可写的身份；E2 的四条写操作只接受它。
    DemoSession:
      type: apiKey
      in: cookie
      name: huice_demo_session
      description: restricted 部署的外层门禁；local 模式没有门禁。
    AdminBearer:
      type: http
      scheme: bearer
      description: ADMIN_TOKEN，E1 后只读。E2 的 DISC-01/03/04/05 可读，写操作一律 403。
  parameters:
    CandidateId:
      name: candidateId
      in: path
      required: true
      description: 候选 id。
      schema:
        $ref: ./openapi.yaml#/components/schemas/UUID
  schemas:
    DiscoveryLimits:
      type: object
      additionalProperties: false
      required:
      - minIntervalMinutes
      - maxIntervalMinutes
      - maxSourceUrls
      - maxCandidatesPerRun
      - runTimeoutMinutes
      - runTokenBudget
      - candidateTokenBudget
      - maxResponseBytes
      - minHostIntervalSeconds
      - maxRedirects
      properties:
        minIntervalMinutes:
          type: integer
          minimum: 360
        maxIntervalMinutes:
          type: integer
          maximum: 43200
        maxSourceUrls:
          type: integer
          minimum: 1
        maxCandidatesPerRun:
          type: integer
          minimum: 1
        runTimeoutMinutes:
          type: integer
          minimum: 1
        runTokenBudget:
          type: integer
          minimum: 1
        candidateTokenBudget:
          type: integer
          minimum: 1
        maxResponseBytes:
          type: integer
          minimum: 1
        minHostIntervalSeconds:
          type: integer
          minimum: 0
        maxRedirects:
          type: integer
          minimum: 0
      description: 服务端口径，回显给前端用于禁用非法输入；与库层 CHECK 和运行器常量同源。
    DiscoverySettings:
      type: object
      additionalProperties: false
      required:
      - enabled
      - sourceUrls
      - intervalMinutes
      - timeZone
      - nextRunAt
      - limits
      properties:
        enabled:
          type: boolean
        sourceUrls:
          type: array
          maxItems: 20
          items:
            $ref: ./openapi.yaml#/components/schemas/OfficialUrl
        intervalMinutes:
          type: integer
          minimum: 360
          maximum: 43200
        timeZone:
          type: string
          minLength: 1
        nextRunAt:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/Timestamp
          - type: 'null'
        limits:
          $ref: '#/components/schemas/DiscoveryLimits'
      description: 发现配置。nextRunAt 由运行器推进，只读；未启用时为 null。
    DiscoverySettingsUpdate:
      type: object
      additionalProperties: false
      required:
      - enabled
      - sourceUrls
      - intervalMinutes
      - timeZone
      properties:
        enabled:
          type: boolean
        sourceUrls:
          type: array
          maxItems: 20
          description: 替换语义：没列出来的网址就等于删除。必须是官方域且不能重复。
          items:
            $ref: ./openapi.yaml#/components/schemas/OfficialUrl
        intervalMinutes:
          type: integer
          minimum: 360
          maximum: 43200
          description: 360—43200 分钟；默认 1440。
        timeZone:
          type: string
          minLength: 1
          description: IANA 时区名（例如 Asia/Shanghai），决定下一次运行的时间落点。
      description: 整份配置的替换体；启用时必须至少有一个来源网址。
    DiscoverySourceStatus:
      type: object
      additionalProperties: false
      required:
      - url
      - status
      properties:
        url:
          $ref: ./openapi.yaml#/components/schemas/OfficialUrl
        status:
          type: string
          enum:
          - ok
          - failed
          - skipped
        links:
          type: integer
          minimum: 0
        candidates:
          type: integer
          minimum: 0
        articleFailures:
          type: integer
          minimum: 0
        errorCategory:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        message:
          anyOf:
          - type: string
          - type: 'null'
      description: 单个来源在本轮的结果。skipped 表示本轮因预算/时限提前收手，不算失败。
    DiscoveryRun:
      type: object
      additionalProperties: false
      required:
      - id
      - startedAt
      - finishedAt
      - status
      - terminalReason
      - sourcesChecked
      - linksSeen
      - duplicates
      - newCandidates
      - failedSources
      - failedArticles
      - tokensUsed
      - tokensUnknown
      - lateBySeconds
      - sourceStatus
      - detail
      properties:
        id:
          $ref: ./openapi.yaml#/components/schemas/UUID
        startedAt:
          $ref: ./openapi.yaml#/components/schemas/Timestamp
        finishedAt:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/Timestamp
          - type: 'null'
        status:
          type: string
          enum:
          - running
          - succeeded
          - partial_failed
          - failed
        terminalReason:
          anyOf:
          - type: string
            enum:
            - completed
            - no_new_policy
            - fetch_failed
            - partial_failed
            - budget_exceeded
            - oversize
            - timeout
            - lock_lost
          - type: 'null'
        sourcesChecked:
          type: integer
          minimum: 0
        linksSeen:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
        newCandidates:
          type: integer
          minimum: 0
        failedSources:
          type: integer
          minimum: 0
        failedArticles:
          type: integer
          minimum: 0
        tokensUsed:
          type: integer
          minimum: 0
        tokensUnknown:
          type: boolean
        lateBySeconds:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        sourceStatus:
          type: array
          items:
            $ref: '#/components/schemas/DiscoverySourceStatus'
        detail:
          anyOf:
          - type: string
          - type: 'null'
      description: >-
        一次运行。running 只会在运行中或进程异常退出后短暂出现（下一轮持锁后收成
        failed/lock_lost）；终态行不会再变。
    DiscoveryRunList:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryRun'
        nextCursor:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
    CandidateStatus:
      type: string
      enum:
      - pending_review
      - extraction_failed
      - submitted
      - discarded
      - expired
      description: >-
        候选状态。pending_review / extraction_failed 可编辑；submitted / discarded / expired
        是终态。expired 只由下一轮轮转产生，已提交与已丢弃的候选不受轮转影响。
    CandidateMetadata:
      type: object
      additionalProperties: false
      description: >-
        候选元数据：字段名与 PolicyImportMetadata 一致，但全部可空——原文没给的字段留空并
        进 missingFields，不由抓取器猜。比导入多两项：version（提交时必填）与 policyId
        （提交到既有政策；null 表示新建一条）。
      properties:
        version:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        policyId:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/UUID
          - type: 'null'
        title:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        type:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/PolicyType
          - type: 'null'
        issuer:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        region:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        documentNumber:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        applicableEntities:
          anyOf:
          - type: array
            items:
              type: string
              minLength: 1
          - type: 'null'
        publishedAt:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/Date
          - type: 'null'
        effectiveFrom:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/Date
          - type: 'null'
        effectiveTo:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/Date
          - type: 'null'
        applicationWindow:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/ApplicationWindow
          - type: 'null'
        officialEntryUrl:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/OfficialUrl
          - type: 'null'
    CandidateSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - runId
      - revision
      - status
      - sourceUrl
      - fetchedAt
      - contentHash
      - title
      - issuer
      - missingFields
      - duplicateOf
      - existingPolicyId
      - existingVersion
      - versionChanged
      - submittedPolicyId
      - submittedVersion
      - createdAt
      properties:
        id:
          $ref: ./openapi.yaml#/components/schemas/UUID
        runId:
          $ref: ./openapi.yaml#/components/schemas/UUID
        revision:
          $ref: ./openapi.yaml#/components/schemas/UUID
        status:
          $ref: '#/components/schemas/CandidateStatus'
        sourceUrl:
          $ref: ./openapi.yaml#/components/schemas/OfficialUrl
        fetchedAt:
          $ref: ./openapi.yaml#/components/schemas/Timestamp
        contentHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        title:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        type:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/PolicyType
          - type: 'null'
        issuer:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        missingFields:
          type: array
          items:
            type: string
            minLength: 1
        duplicateOf:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/UUID
          - type: 'null'
        existingPolicyId:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/UUID
          - type: 'null'
        existingVersion:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        versionChanged:
          type: boolean
        submittedPolicyId:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/UUID
          - type: 'null'
        submittedVersion:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        createdAt:
          $ref: ./openapi.yaml#/components/schemas/Timestamp
    CandidateList:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CandidateSummary'
        nextCursor:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
    CandidateDetail:
      type: object
      additionalProperties: false
      required:
      - id
      - runId
      - revision
      - status
      - sourceUrl
      - fetchedAt
      - contentHash
      - rawHash
      - metadata
      - attachmentUrls
      - missingFields
      - bodyText
      - criteria
      - validationFindings
      - usage
      - duplicateOf
      - existingPolicyId
      - existingVersion
      - versionChanged
      - submittedPolicyId
      - submittedVersion
      - discardReason
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: ./openapi.yaml#/components/schemas/UUID
        runId:
          $ref: ./openapi.yaml#/components/schemas/UUID
        revision:
          $ref: ./openapi.yaml#/components/schemas/UUID
        status:
          $ref: '#/components/schemas/CandidateStatus'
        sourceUrl:
          $ref: ./openapi.yaml#/components/schemas/OfficialUrl
        fetchedAt:
          $ref: ./openapi.yaml#/components/schemas/Timestamp
        contentHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        rawHash:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
        metadata:
          $ref: '#/components/schemas/CandidateMetadata'
        attachmentUrls:
          type: array
          items:
            $ref: ./openapi.yaml#/components/schemas/OfficialUrl
          description: >-
            页面上识别到的附件地址，首版不下载、不解析。非空时 validationFindings 必然附带一条
            ATTACHMENT_NOT_EXTRACTED（criterionId 为 null）：它由本字段派生、不落库，所以保存
            criteriaDrafts 之后仍在，提交出的草稿里也带同一条。
        missingFields:
          type: array
          items:
            type: string
            minLength: 1
        bodyText:
          type: string
        criteria:
          type: array
          items:
            $ref: ./openapi.yaml#/components/schemas/Criterion
        validationFindings:
          type: array
          items:
            $ref: ./openapi.yaml#/components/schemas/ValidationFinding
        usage:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/ModelUsage
          - type: 'null'
        duplicateOf:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/UUID
          - type: 'null'
        existingPolicyId:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/UUID
          - type: 'null'
        existingVersion:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        versionChanged:
          type: boolean
        submittedPolicyId:
          anyOf:
          - $ref: ./openapi.yaml#/components/schemas/UUID
          - type: 'null'
        submittedVersion:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        discardReason:
          anyOf:
          - type: string
          - type: 'null'
        createdAt:
          $ref: ./openapi.yaml#/components/schemas/Timestamp
        updatedAt:
          $ref: ./openapi.yaml#/components/schemas/Timestamp
      description: >-
        候选详情。取证字段（sourceUrl / fetchedAt / contentHash / rawHash / bodyText /
        attachmentUrls）只读：人工不能改证据，只能改确认过的元数据与结构化条件。
    CandidateUpdate:
      type: object
      additionalProperties: false
      required:
      - metadata
      properties:
        metadata:
          $ref: '#/components/schemas/CandidateMetadata'
        criteriaDrafts:
          anyOf:
          - type: array
            items:
              $ref: ./openapi.yaml#/components/schemas/CriterionDraft
          - type: 'null'
      description: >-
        metadata 是替换语义（整份覆盖）；传 criteriaDrafts 则整组替换结构化条件。
        不传 criteriaDrafts 表示不改条件。
    DiscardCandidateInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
      description: 丢弃原因，可选，最长 500 字。
