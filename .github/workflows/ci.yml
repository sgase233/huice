name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: huice
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: huice_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U huice -d huice_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      HUICE_TEST_DATABASE_URL: postgresql://huice:ci-only-password@127.0.0.1:5432/huice_test
      HUICE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - run: python -m pip install -r services/api/requirements.lock
      - run: python -m pip check
      - run: python contracts/generate_types.py --check
      - name: Run backend, contract and integration tests
        working-directory: services/api
        run: python -m pytest -q -m 'not obs and not deepseek'

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  data:
    name: CSV format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check CSV encoding and column counts
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          for path in sorted(Path('data').rglob('*.csv')):
              with path.open(encoding='utf-8-sig', newline='') as stream:
                  rows = csv.reader(stream, strict=True)
                  header = next(rows)
                  if not header or any(not name.strip() for name in header) or len(set(header)) != len(header):
                      raise ValueError(f'{path}: empty or duplicate header')
                  for line, row in enumerate(rows, start=2):
                      if len(row) != len(header):
                          raise ValueError(f'{path}:{line}: expected {len(header)} columns, got {len(row)}')
                  print(f'{path}: OK')
          PY
