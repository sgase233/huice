          anyOf:
          - type: string
          - type: 'null'
    RunStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      description: |
        **封闭枚举，E1 只有这四个取值**：
        - `queued`：已受理、尚未开始（E1 起的新写入从这里开始）；
        - `running`：执行中；
        - `succeeded`：完成且有结果快照；
        - `failed`：执行失败，或依赖在重试后仍不可用。

        E1 不产生也不扫描 `interrupted`；E3b 落地 D5.3 的启动扫描后才会新增该取值。

        **新增取值不是「文字上的前向兼容」**：`enum` 是封闭集合，严格的 OpenAPI 校验器与
        按本契约生成的客户端类型都会拒绝 `enum` 以外的值。因此：
        - E1 的服务端**保证**不产生这四值以外的字符串，前端不需要靠兜底逻辑「接住」未知值；
        - E3b 增加 `interrupted` 时，必须**同时**升契约版本（`1.1.x` → `1.2.x` 之类）、
          重新生成 `apps/web/src/api/types.ts` 并随前端同窗发布；只升后端不升前端是**不允许的发布组合**；
        - 前端仍建议对未识别值降级为「未完成」（`reportAvailable=false`、详情 409
          `RUN_NOT_COMPLETED`、列表原样展示、不自动重跑），但这属于**滚动升级窗口的防御性处理**，
          不是本契约承诺的前向兼容，也不能替代版本与类型同步。
      x-e1-lifecycle:
        e1: [queued, running, succeeded, failed]
        e1-does-not-emit: [interrupted]
        reserved: interrupted
        addedBy: E3b（D5.3 启动扫描）
        adding-a-value-requires: 契约版本升版 + 重新生成前端类型 + 同窗口发布（不允许后端单边先行）
        e1-orphan-handling: '进程崩溃留下的 running 在 E1 保持 running，不自动改写'
        consumer-fallback: 防御性处理，不是契约承诺
    RunSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - enterpriseId
      - asOf
      - createdAt
      - status
      - reportAvailable
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        enterpriseId:
          $ref: '#/components/schemas/UUID'
        asOf:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
