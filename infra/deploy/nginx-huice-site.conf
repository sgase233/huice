# Purpose: same-origin demo site — 443 同时提供前端静态文件与 API（M1）。
# Install: enable-tls.sh --web-root <前端 dist 目录> 会把它装成 /etc/nginx/conf.d/huice-api-tls.conf
#          （见 infra/deploy/README.md §3.2）。__WEB_ROOT__ 由脚本替换成实际目录。
# Notes: 它与 nginx-huice-tls.conf 是**同一个 443 站点的两种形态**，不能同时安装：两者都是
#        `listen 443` + `server_name _`，并存时 nginx 只认先加载的那份，并报
#        `conflicting server name "_" on 0.0.0.0:443`。enable-tls.sh 固定写到同一个文件名，
#        因此「切到同源站点」和「退回仅 API」都是重跑脚本，而不是并发装两份。
#        前端只有与 API 同源时演示会话 cookie（SameSite=Lax）才会被浏览器带上；
#        构建时须让 API 走相对路径（`VITE_API_BASE_URL=/api/v1`），否则前端仍指回 127.0.0.1:8000。

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/huice/tls/huice.crt;
    ssl_certificate_key /etc/huice/tls/huice.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # API-04 accepts up to 5 files × 10 MiB; leave room for multipart overhead.
    client_max_body_size 60m;
    client_body_timeout 60s;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    root  __WEB_ROOT__;
    index index.html;

    access_log /var/log/nginx/huice-api.access.log;
    error_log  /var/log/nginx/huice-api.error.log warn;

    # 缺少结尾斜杠的 /api/v1 交给 SPA 回退会返回一段 HTML，看起来像「接口坏了」。
    location = /api/v1 {
        return 308 /api/v1/;
    }

    # 前端页面里的 /api/v1/... 回到本机 API：同源，浏览器才会带上演示会话 cookie。
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 上传与 PDF 解析是同步阻塞工作，(5 × 10 MiB) 留足时间。
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 流式转发，避免先把大请求体读进内存。
        proxy_request_buffering off;
    }

    # index.html 本身不缓存：发布后刷新即拿到新的资源清单（带哈希的文件名才有长缓存）。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Vite 产物文件名带内容哈希，可以长缓存；缺失时直接 404，不要退回 index.html，
    # 否则一个拼错的资源路径会变成 200 的 HTML，浏览器报错难以定位。
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA 路由回退：/admin/review 这类前端路由直接刷新也要给出 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
