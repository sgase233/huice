      - $ref: '#/components/parameters/PolicyType'
      - $ref: '#/components/parameters/Region'
      - $ref: '#/components/parameters/AsOf'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功
          headers:
            X-Trace-Id: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyList'
              example:
                items:
                - &id058
                  id: 22222222-2222-4222-8222-222222222222
                  title: 合成演示政策（非真实政策）
                  type: tax
                  issuer: 演示发布者
                  region: '440300'
                  version: demo-v1
                  status: published
                  effectiveFrom: '2026-01-01'
                  effectiveTo: null
                  applicationWindow: null
                  sourceUrl: https://www.gov.cn/
                nextCursor: null
        default:
          $ref: '#/components/responses/ApiFailure'
        '400': *id004
        '401': *id005
        '403': *id006
        '500': *id007
        '503': *id008
  /policies/{policyId}:
